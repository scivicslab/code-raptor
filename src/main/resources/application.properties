# code-raptor server
quarkus.http.port=4000
quarkus.package.jar.type=uber-jar
quarkus.http.host=0.0.0.0

# Disable compression for MCP streaming
quarkus.http.enable-compression=false
quarkus.http.idle-timeout=PT0S

# CORS for MCP clients and browser UI
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/

# Works directory (override with -Dcode.raptor.works-dir=...)
code.raptor.works-dir=${user.home}/works

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.level=INFO
